{% extends "base.html" %}
{% block content %}
<h2>Listing - Single Number</h2>
<form method="POST">
    <div class="form-group">
        <label for="telephone">Telephone</label>
        <input type="text" id="telephone" name="telephone" placeholder="6XXXXXXXX" required>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="beginDate">Begin Date</label>
            <input type="date" id="beginDate" name="beginDate" required>
        </div>
        <div class="form-group">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate" name="endDate" required>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Search</button>
</form>

{% if all_files_name %}
<h3>Download Files</h3>
<ul class="file-list">
    {% for doc in all_files_name %}
    <li>
        <a href="{{ url_for('download.download', file_path=date_requisition_string + '/' + good_phone + '/' + doc) }}">
            {% if doc.endswith('.pdf') %}[PDF]{% else %}[XLSX]{% endif %} {{ doc }}
        </a>
    </li>
    {% endfor %}
</ul>
{% endif %}
{% endblock %}
