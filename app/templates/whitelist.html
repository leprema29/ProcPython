{% extends "base.html" %}
{% block content %}
<h2>Manage White List</h2>
<form method="POST">
    <div class="form-group">
        <label for="whiteList">White List Numbers (one per line)</label>
        <textarea id="whiteList" name="whiteList" rows="15" cols="50">{{ white_list }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Update White List</button>
</form>
{% endblock %}
