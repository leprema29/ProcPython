<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <f:view>
            <ui:composition template="layout.xhtml">
                <ui:define name="contenu">
                    <h:form id="createuserForm">
                        <center>
                            <h1>
                                <p:outputLabel value="Create User"/>
                            </h1>
                        </center>
                        <p:ajaxStatus> 
                            <p:messages id="messages" showDetail="true"/>
                            <h:panelGrid columns="2" cellspacing="20">
                                <p:outputLabel for="name" value="Name "/>
                                <p:inputText id="name" value="#{userMBean.user.name}"  required="true" size="50"/>
                                <p:outputLabel for="log_in" value="Login "/>
                                <p:inputText id="log_in" value="#{userMBean.user.login}"  required="true" size="50"/>
                                <p:outputLabel for="pwd1" value="Password " />
                                <p:password id="pwd1" value="#{userMBean.user.password}" match="pwd2" label="New Password" required="true" feedback="true"  size="50"/>
                                <p:outputLabel for="pwd2" value="Password again " />
                                <p:password id="pwd2" value="#{userMBean.user.password}" label="New Password" required="true"  size="50"/>
                                <p:outputLabel for="phone" value="Telephone "/>
                                <p:inputText id="phone" value="#{userMBean.user.phone}"  required="true" size="50"/>
                                <p:outputLabel for="gender" value="Gender "/>
                                <p:inputText id="gender" value="#{userMBean.user.gender}"  required="true" size="50"/>
                                <p:outputLabel for="email" value="Email "/>
                                <p:inputText id="email" required="true" label="email" size="50"
                                             requiredMessage="Please enter your email address."
                                             validatorMessage="Invalid email format"
                                             value="#{userMBean.user.email}">
                                    <f:validateRegex
                                        pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
                                </p:inputText>
                                <p:watermark for="email" value="Email Address *" />
                                <p:message for="email" />

                                <p:commandButton value="Submit" actionListener="#{userMBean.createUser()}" update="createuserForm" global="true"/>
                            </h:panelGrid>
                            <f:facet name="start">
                                <p:graphicImage library="images" name="ajax-loader.gif" style="position: absolute;"/>
                            </f:facet>
                        </p:ajaxStatus>

                    </h:form>
                </ui:define>
            </ui:composition>
        </f:view>
    </h:body>
</html>
