<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <f:view>
            <ui:composition template="layout.xhtml">
                <ui:define name="contenu">
                    <h:form id="identificationForm">
                        <center>
                            <h1>
                                <p:outputLabel value="Subscribers Identification"/>
                            </h1>
                        </center>
                        <p:ajaxStatus style="display:block;margin-bottom:2em;height:24px;"> 
                            <p:panelGrid columns="6" styleClass="ui-grid-row">
                                <p:outputLabel for="identificationPhone" value="Telephone: "/>
                                <p:inputMask id="identificationPhone" mask="999-999-999" value="#{identificationMBean.telephone}" disabled="#{!identificationMBean.telephoneEnable}" size="35">
                                    <p:ajax event="change" listener="#{identificationMBean.phoneDisableOthers()}" update="identificationForm" />
                                </p:inputMask>

                                <p:outputLabel for="identificationID" value="ID Number: "/>
                                <p:inputText id="identificationID" placeholder="Id number" value="#{identificationMBean.idNumber}" disabled="#{!identificationMBean.idNumberEnable}" size="35">
                                    <p:ajax event="change" listener="#{identificationMBean.idNumberDisableOthers()}" update="identificationForm" />
                                </p:inputText>

                                <p:outputLabel for="identificationName" value="Name: "/>
                                <p:inputText id="identificationName" placeholder="Name" value="#{identificationMBean.name}" disabled="#{!identificationMBean.nameEnable}" size="35">
                                    <p:ajax event="change" listener="#{identificationMBean.nameDisableOthers()}" update="identificationForm" />
                                </p:inputText>

                                <p:commandButton value="Submit" actionListener="#{identificationMBean.findIdentification()}" update="subscribers" global="true"/>
                            </p:panelGrid>
                            <f:facet name="start">
                                <p:graphicImage library="images" name="ajax-loader.gif" style="position: absolute;"/>
                            </f:facet>
                        </p:ajaxStatus>
                        <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />
                        <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                            <p:graphicImage  library="images" name="processing.gif"/>
                        </p:dialog>

                        <p:separator/>

                        <p:dataTable id="subscribers" var="subscriber" value="#{identificationMBean.allSubscribers}"
                                     rows="10"
                                     paginator="true"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                                     >
                            <p:column filterBy="#{subscriber.telephone}" headerText="Telephone" filterMatchMode="contains">
                                <h:outputText value="#{subscriber.telephone}" />
                            </p:column>
                            <p:column headerText="Operator">
                                <h:outputText value="#{subscriber.operator}" />
                            </p:column>
                            <p:column filterBy="#{subscriber.name}" headerText="Name"  filterMatchMode="contains">
                                <h:outputText value="#{subscriber.name}" />
                            </p:column>
                            <p:column headerText="Birth Date">
                                <h:outputText value="#{identificationMBean.formatDate(subscriber.birthday)}" />
                            </p:column>
                            <p:column headerText="Address">
                                <h:outputText value="#{subscriber.address}" />
                            </p:column>
                            <p:column filterBy="#{subscriber.cni}" headerText="ID Number" filterMatchMode="contains">
                                <h:outputText value="#{subscriber.cni}" />
                            </p:column>
                            <p:column headerText="Expire Date">
                                <h:outputText value="#{identificationMBean.formatDate(subscriber.expireDate)}" />
                            </p:column>
                            <p:column headerText="Status">
                                <h:outputText value="#{subscriber.status}" />
                            </p:column>
                        </p:dataTable>
                    </h:form>
                </ui:define>
            </ui:composition>
        </f:view>
    </h:body>
</html>
