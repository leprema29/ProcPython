<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <f:view>
            <ui:composition template="layout.xhtml">
                <ui:define name="contenu">
                    <h:form id="edituserForm">
                        <center>
                            <h1>
                                <p:outputLabel value="Change user password"/>
                            </h1>
                        </center>
                        <p:ajaxStatus> 
                            <p:messages id="messages" showDetail="true"/>
                            <h:panelGrid columns="2" cellspacing="20">
                                <p:outputLabel for="oldpwd" value="Enter old password "/>
                                <p:password id="oldpwd" value="#{sessionMBean.oldPassword}"  required="true" size="50"/>

                                <p:outputLabel for="pwd1" value="Enter new password " />
                                <p:password id="pwd1" value="#{sessionMBean.newPassword}" match="pwd2" label="New Password" required="true"  size="50"/>
                                <p:outputLabel for="pwd2" value="Enter new password again " />
                                <p:password id="pwd2" value="#{sessionMBean.newPassword}" label="New Password" required="true"  size="50"/>

                                <p:commandButton value="Submit" actionListener="#{sessionMBean.changePassword()}" update="edituserForm" global="true"/>
                            </h:panelGrid>
                            <f:facet name="start">
                                <p:graphicImage library="images" name="ajax-loader.gif" style="position: absolute;"/>
                            </f:facet>
                        </p:ajaxStatus>

                    </h:form>
                </ui:define>
            </ui:composition>
        </f:view>
    </h:body>
</html>
