<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <f:view>
            <ui:composition template="layout.xhtml">
                <ui:define name="contenu">
                    <h:form id="listingForm">
                        <center>
                            <h1>
                                <p:outputLabel value="Subscribers Listing"/>
                            </h1>
                        </center>
                        <p:ajaxStatus> 
                            <!--<p:messages id="messages" showDetail="true" autoUpdate="true" />-->
                            <p:panelGrid id="p" columns="2" styleClass="ui-grid-row" layout="grid">
                                <p:panelGrid columns="1" styleClass="ui-grid-row">
                                    <!--                                    <p:outputLabel for="phoneListing" value="Telephones:"/>
                                                                        <p:inputMask id="phoneListing" mask="999-999-999" value="#{listingMBean.telephone}" disabled="#{!listingMBean.telephoneEnable}" required="true">
                                                                            <p:ajax event="change" listener="#{listingMBean.phoneDisableOthers()}" update="listingForm" />
                                                                        </p:inputMask>-->
                                    <ui:repeat value="#{listingMBean.inputPhones}" var="phone">
                                        <p:panelGrid columns="2" styleClass="ui-grid-row">
                                            <p:outputLabel value="Telephone #{listingMBean.inputPhones.indexOf(phone)+1}:"/>
                                            <p:inputMask  mask="999-999-999" value="#{phone.numero}">
                                                <p:ajax event="change" listener="#{listingMBean.addPhoneInputField(listingMBean.inputPhones.indexOf(phone))}" update="listingForm"/>
                                            </p:inputMask>
                                        </p:panelGrid>

                                    </ui:repeat>
                                    <!--                                    <p:outputLabel for="imeiListing" value="IMEI:"/>
                                                                        <p:inputText id="imeiListing" value="#{listingMBean.imei}" disabled="#{!listingMBean.imeiEnable}">
                                                                            <p:ajax event="change" listener="#{listingMBean.imeiDisableOthers()}" update="listingForm" />
                                                                        </p:inputText>-->
                                </p:panelGrid>
                                <p:panelGrid columns="2" styleClass="ui-grid-row">
                                    <p:outputLabel for="beginDateListing" value="Begin Date:"/>
                                    <p:calendar id="beginDateListing" pattern="MM/dd/yyyy HH:mm:ss" value="#{listingMBean.beginDate}"  required="true"/>
                                    <p:outputLabel for="endDateListing" value="End Date:"/>
                                    <p:calendar id="endDateListing" pattern="MM/dd/yyyy HH:mm:ss" value="#{listingMBean.endDate}"  required="true"/>
                                </p:panelGrid>
                                <p:commandButton value="Submit" actionListener="#{listingMBean.findListing()}" update="files" global="true"/>
                            </p:panelGrid>
                            <f:facet name="start">
                                <p:graphicImage library="images" name="ajax-loader.gif" style="position: absolute;"/>
                            </f:facet>
                        </p:ajaxStatus>
                        <p:separator/>
                        <br/>

                        <center>
                            <h1>
                                <p:outputLabel value="Downloading files"/>
                            </h1>
                        </center>
                        <p:dataList id="files" value="#{listingMBean.allFilesName}" var="doc" itemType="disc" paginator="true"
                                    paginatorAlwaysVisible="false"
                                    paginatorPosition="bottom"
                                    rows="10"
                                    emptyMessage="No documents found">
                            <a href="image/#{listingMBean.goodPhone}/#{doc}" title="#{doc}">
                                <p:graphicImage library="images" name="#{listingMBean.getTypeFichier(doc)}" width="32" height="32"/>
                                <h:outputText value="#{doc}" style="font-size: 14px;"/>
                            </a>
                            <br/>
                            <br/>
                        </p:dataList>
                    </h:form>
                </ui:define>
            </ui:composition>
        </f:view>
    </h:body>
</html>
